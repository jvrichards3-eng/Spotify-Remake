<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spotify</title>
    <link rel="stylesheet" href="./global.css" type="text/css">
</head>
<body>
    <header class="site-header">
        <a class="logo-link">
            <img src="./Images/logos/spotify-logo.png" class="icons">
        </a>

        <div class="header-center">
            <img src="./Images/Icons/home-icon.png" class="icons">

            <form class="search-bar">
                <img src="./Images/Icons/search-icon.png" class="icons">
                <input class="search-input">
            </form>
        </div>
        
        <nav class="header-nav">
            <ul class="nav-links">
                <li>Premium</li>
                <li>Support</li>
                <li>Download</li>
            </ul>
            <div class="header-actions">
                <a class="install-link"> 
                <img src="./Images/Icons/download-icon.png" class="icons">
                <a class="signup-link">Sign up</a>
                <a class="pill-button">Log-in</a>
            </div>
        </nav>
    </header>

    <aside class="side-bar">

        
            
    </aside>

    <main class="main">
        <section class="album-grid">
            
        </section>
    </main>

    <footer>
        
    </footer>
</body>
</html>
